ckeditor5_plugin_pack_font__font:
  ckeditor5:
    plugins:
      - font.Font
  drupal:
    label: CKEditor 5 Font
    elements: false
    library: ckeditor5_plugin_pack_font/font
    admin_library: ckeditor5_plugin_pack_font/admin.font
    conditions:
      plugins:
        - ckeditor5_plugin_pack_font__font_color
        - ckeditor5_plugin_pack_font__font_family
        - ckeditor5_plugin_pack_font__font_size

ckeditor5_plugin_pack_font__font_color:
  ckeditor5:
    plugins: [font.FontColor, font.FontBackgroundColor]
  drupal:
    label: Font Colors
    elements:
      - <span>
    class: Drupal\ckeditor5_plugin_pack_font\Plugin\CKEditor5Plugin\FontColor
    toolbar_items:
      fontColor:
        label: Color
      fontBackgroundColor:
        label: Background


ckeditor5_plugin_pack_font__font_family:
  ckeditor5:
    plugins:
      - font.FontFamily
  drupal:
    label: CKEditor 5 Font family
    class: Drupal\ckeditor5_plugin_pack_font\Plugin\CKEditor5Plugin\FontFamily
    elements:
      - <span>
    toolbar_items:
      fontFamily:
        label: Font family

ckeditor5_plugin_pack_font__font_size:
  ckeditor5:
    plugins:
      - font.FontSize
  drupal:
    label: CKEditor 5 Font size
    class: Drupal\ckeditor5_plugin_pack_font\Plugin\CKEditor5Plugin\FontSize
    elements:
      - <span>
    toolbar_items:
      fontSize:
        label: Font size

