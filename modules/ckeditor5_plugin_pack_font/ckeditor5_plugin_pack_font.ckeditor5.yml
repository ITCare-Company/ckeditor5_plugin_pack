ckeditor5_plugin_pack_font__font:
  ckeditor5:
    plugins:
      - font.Font
  drupal:
    label: CKEditor 5 Font
    elements: false
    library: ckeditor5_plugin_pack_font/font
    admin_library: ckeditor5_plugin_pack_font/admin.font


ckeditor5_plugin_pack_font__font_color:
  ckeditor5:
    plugins: [font.FontColor, font.FontBackgroundColor]
  drupal:
    label: Font Colors
    elements:
      - <p>
    admin_library: ckeditor5_plugin_pack_font/admin.font_color
    class: Drupal\ckeditor5_plugin_pack_font\FontColorsManager
    toolbar_items:
      fontColor:
        label: Color
      fontBackgroundColor:
        label: Background


ckeditor5_plugin_pack_font__font_family:
  ckeditor5:
    plugins:
      - font.FontFamily
  drupal:
    label: CKEditor 5 Font family
    elements: false
    toolbar_items:
      fontFamily:
        label: Font family
    conditions:
      plugins:
        - ckeditor5_plugin_pack_font__font

ckeditor5_plugin_pack_font__font_size:
  ckeditor5:
    plugins:
      - font.FontSize
  drupal:
    label: CKEditor 5 Font size
    elements: false
    toolbar_items:
      fontSize:
        label: Font size
    conditions:
      plugins:
        - ckeditor5_plugin_pack_font__font
